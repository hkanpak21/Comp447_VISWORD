# SALAD ablation: softmax_assign — replace Sinkhorn-OT (with dustbin) by
# per-patch softmax over clusters. Same descriptor shape (8448-d) as full.
# Tests whether the OT structure (balanced marginals + dustbin slack) is
# what carries the SALAD win, vs vanilla NetVLAD-style soft assignment.
#
# Usage:
#   sbatch --export=ALL,CONFIG=configs/salad_ab_softmax.yaml,RUN_NAME=salad-ab-softmax slurm/train.sbatch

experiment_name: visword-salad-ab-softmax
model_kind: salad

data:
  num_train_samples: 4000
  num_eval_samples: 800

salad:
  ablation: softmax_assign

train:
  loss: multisim
  k_per_page: 4
  batch_size: 16
  epochs: 2
  lr_backbone: 1.0e-5
  lr_head: 5.0e-4
  eval_every_steps: 100
  num_diag_batches: 3

eval:
  k_values: [1, 5, 10, 20]
  phase1_max_pages: 400
  phase2_max_queries: 200
