# Row 22b — CLIP image FROZEN + MLP head trained on top.
# Row 22 (CLIP fine-tune) collapsed to a constant descriptor at lr_bb=1e-5.
# This variant keeps CLIP intact and only trains the head.

experiment_name: visword-row22b-clip-cls-frozen
model_kind: clip_cls

data:
  num_train_samples: 4500
  num_eval_samples: 500

backbone:
  num_trainable_blocks: 0       # freeze ALL CLIP blocks

train:
  loss: multisim
  k_per_page: 4
  batch_size: 16
  epochs: 3
  lr_backbone: 0.0
  lr_head: 5.0e-4
  eval_every_steps: 200
  num_diag_batches: 3

eval:
  k_values: [1, 5, 10, 20]
  phase1_max_pages: 500
  phase2_max_queries: 200
