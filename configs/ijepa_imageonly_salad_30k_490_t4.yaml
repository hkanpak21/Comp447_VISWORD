# I-JEPA Image-Only backbone + SALAD head — 490×490 native resolution
# Single T4, 48h — matches the successful ijepa-texttarget-salad run (23.8h).
# Previous attempt crashed at step 69 due to a 4h job time-limit (not OOM).
# Backbone: ijepa-pretrain-all-blocks-full-r_b5ac (visual I-JEPA, 90k, 490×490)
# Head: SALAD, last-4-blocks unfrozen, 30k pages
experiment_name: ijepa-imageonly-salad-30k-490

model_kind: ijepa_salad

backbone:
  arch: ijepa_vith14
  feature_dim: 1280
  num_trainable_blocks: 4
  pretrained_checkpoint: /scratch/bbakay22/VISWORD/runs/2026-06-03_070501_acfc947c_ijepa-pretrain-all-blocks-full-r_b5ac/checkpoints/best_phase1.pt

salad:
  num_clusters: 64
  cluster_dim: 128
  token_dim: 256
  sinkhorn_iters: 3
  ablation: full

cropper:
  crop_size: 490
  overlap: 0.0
  min_text_ratio: 0.05
  target_size: 490   # native resolution — no downsampling

data:
  num_train_samples: 30000
  num_eval_samples: 2000

train:
  loss: multisim
  k_per_page: 4
  batch_size: 8    # T4 16GB — same as text-target runs (3.4 GB peak, no OOM)
  epochs: 3
  lr_backbone: 5.0e-6
  lr_head: 5.0e-4
  eval_every_steps: 400
  num_diag_batches: 3

eval:
  k_values: [1, 5, 10, 20]
  phase1_max_pages: 2000
  phase2_max_queries: 200
