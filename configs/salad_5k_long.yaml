# SALAD-full deeply trained on the existing 5k cache (8 epochs vs 3 in
# salad_5k_main). Both prior checkpoints were still climbing at the end
# of training (best @ 800 of 840 steps); this run lets us see whether
# the loss surface saturates or keeps yielding.
#
# 8 epochs × 4500 train / (16/4 = 4 pages per batch) = ~2240 steps
# At ~3s/step on T4 → ~110 min train.

experiment_name: visword-salad-5k-long
model_kind: salad

data:
  num_train_samples: 4500
  num_eval_samples: 500

train:
  loss: multisim
  k_per_page: 4
  batch_size: 16
  epochs: 8
  lr_backbone: 1.0e-5
  lr_head: 5.0e-4
  eval_every_steps: 200
  num_diag_batches: 3

eval:
  k_values: [1, 5, 10, 20]
  phase1_max_pages: 500
  phase2_max_queries: 200
