# SALAD-full at the salad_main recipe (bs=32, 3 epochs, eval_every=200)
# but on the 5k cache. Lets us test the "more training" hypothesis without
# waiting for the prefetch to scale up to 21k.
#
# Differences from salad_smoke:
#   - batch_size 16 -> 32  (more negatives per contrastive batch)
#   - epochs 2 -> 3
#   - eval_every_steps 100 -> 200
#   - train samples 4000 -> 4500 (use almost the full 5k cache)
#
# Differences from salad_main: only num_train/eval_samples (data-limited).

experiment_name: visword-salad-5k-main
model_kind: salad

data:
  num_train_samples: 4500
  num_eval_samples: 500

train:
  loss: multisim
  k_per_page: 4
  batch_size: 32
  epochs: 3
  lr_backbone: 1.0e-5
  lr_head: 5.0e-4
  eval_every_steps: 200
  num_diag_batches: 3

eval:
  k_values: [1, 5, 10, 20]
  phase1_max_pages: 500
  phase2_max_queries: 200
