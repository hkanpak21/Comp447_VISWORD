# Row 23 — CLIP-ViT-B/16 image branch + SALAD-full aggregator, last 4 blocks
# fine-tune. CLIP-family counterpart of row 12 (DINOv2-SALAD-main).
#
# This is the strategic-pivot experiment: zero-shot CLIP image branch
# already gets P2 R@1 = 0.932 vs the best DINOv2 fine-tune at 0.441.
# Does fine-tuning CLIP with SALAD on top push it further, or destroy
# CLIP's transfer?

experiment_name: visword-row23-clip-salad
model_kind: clip_salad

data:
  num_train_samples: 4500
  num_eval_samples: 500

train:
  loss: multisim
  k_per_page: 4
  batch_size: 16
  epochs: 3
  lr_backbone: 1.0e-5
  lr_head: 5.0e-4
  eval_every_steps: 200
  num_diag_batches: 3

eval:
  k_values: [1, 5, 10, 20]
  phase1_max_pages: 500
  phase2_max_queries: 200
