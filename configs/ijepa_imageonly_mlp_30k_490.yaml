# I-JEPA Image-Only backbone + MLP head — 490×490 native resolution (no downsampling)
# Backbone: ijepa-pretrain-all-blocks-full-r_b5ac (visual I-JEPA, 90k, 490×490)
# Head: MLP, last-4-blocks unfrozen, 30k pages
# Consistent with backbone: body-text eval (retrieval is image-only contrastive, text_source unused in loss)
experiment_name: ijepa-imageonly-mlp-30k-490

model_kind: ijepa_finetune

backbone:
  arch: ijepa_vith14
  feature_dim: 1280
  num_trainable_blocks: 4
  pretrained_checkpoint: /scratch/bbakay22/VISWORD/runs/2026-06-03_070501_acfc947c_ijepa-pretrain-all-blocks-full-r_b5ac/checkpoints/best_phase1.pt

cropper:
  crop_size: 490
  overlap: 0.0
  min_text_ratio: 0.05
  target_size: 490   # native resolution — no downsampling

data:
  num_train_samples: 30000
  num_eval_samples: 2000

train:
  loss: multisim
  k_per_page: 4
  batch_size: 8    # A40 48GB — conservative for 1225-patch ViT-H crops
  epochs: 3
  lr_backbone: 5.0e-6
  lr_head: 5.0e-4
  eval_every_steps: 400
  num_diag_batches: 3

eval:
  k_values: [1, 5, 10, 20]
  phase1_max_pages: 2000
  phase2_max_queries: 200
