# CLS counterpart of salad_15k.
experiment_name: visword-cls-15k
model_kind: cls

data:
  num_train_samples: 15000
  num_eval_samples: 1500

train:
  loss: multisim
  k_per_page: 4
  batch_size: 16
  epochs: 3
  lr_backbone: 1.0e-5
  lr_head: 5.0e-4
  eval_every_steps: 400
  num_diag_batches: 3

eval:
  k_values: [1, 5, 10, 20]
  phase1_max_pages: 1500
  phase2_max_queries: 200
