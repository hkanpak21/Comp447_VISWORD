# DINOv2 ViT-B/14 frozen + Linear adapter (768 → 256)
experiment_name: adapter-dinov2-linear
model_kind: frozen_adapter

backbone:
  arch: dinov2_vitb14
  feature_dim: 768
  num_trainable_blocks: 0

adapter:
  kind: linear
  output_dim: 256

data:
  num_train_samples: 10000
  num_eval_samples: 1000

train:
  loss: multisim
  batch_size: 16
  epochs: 3
  lr_backbone: 0.0
  lr_head: 5.0e-4
