# CLS-only 8-epoch counterpart to configs/salad_5k_long.yaml.
# CLS gained MORE from 2→3 epochs than SALAD did (R@10: 0.447→0.653 vs
# 0.871→0.955). Worth seeing whether CLS keeps closing the gap.

experiment_name: visword-cls-5k-long
model_kind: cls

data:
  num_train_samples: 4500
  num_eval_samples: 500

train:
  loss: multisim
  k_per_page: 4
  batch_size: 16
  epochs: 8
  lr_backbone: 1.0e-5
  lr_head: 5.0e-4
  eval_every_steps: 200
  num_diag_batches: 3

eval:
  k_values: [1, 5, 10, 20]
  phase1_max_pages: 500
  phase2_max_queries: 200
