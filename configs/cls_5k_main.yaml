# CLS-only baseline at the salad_main recipe (bs=32, 3 epochs) on 5k cache.
# Apples-to-apples partner of configs/salad_5k_main.yaml.

experiment_name: visword-cls-5k-main
model_kind: cls

data:
  num_train_samples: 4500
  num_eval_samples: 500

train:
  loss: multisim
  k_per_page: 4
  batch_size: 16  # match SALAD's bs (T4 OOM at 32) for apples-to-apples
  epochs: 3
  lr_backbone: 1.0e-5
  lr_head: 5.0e-4
  eval_every_steps: 200
  num_diag_batches: 3

eval:
  k_values: [1, 5, 10, 20]
  phase1_max_pages: 500
  phase2_max_queries: 200
