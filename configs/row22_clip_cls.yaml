# Row 22 — CLIP-ViT-B/16 image branch + MLP head, last 4 blocks fine-tune.
# CLIP family counterpart of row 9 (DINOv2-CLS-main).
# Tests: when we fine-tune CLIP instead of DINOv2 with the same head/loss,
# does the SALAD>CLS gap close? Does Phase-2 transfer hold up?

experiment_name: visword-row22-clip-cls
model_kind: clip_cls

data:
  num_train_samples: 4500
  num_eval_samples: 500

train:
  loss: multisim
  k_per_page: 4
  batch_size: 16
  epochs: 3
  lr_backbone: 1.0e-5
  lr_head: 5.0e-4
  eval_every_steps: 200
  num_diag_batches: 3

eval:
  k_values: [1, 5, 10, 20]
  phase1_max_pages: 500
  phase2_max_queries: 200
