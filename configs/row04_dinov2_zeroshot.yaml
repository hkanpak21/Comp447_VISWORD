# Method ladder — Row 4: DINOv2 ViT-B/14 zero-shot, raw CLS token.
# No training; backbone fully frozen. Descriptor = L2-norm(CLS), 768-d.
#
# Usage:
#   sbatch --export=ALL,CONFIG=configs/row04_dinov2_zeroshot.yaml,RUN_NAME=row04_dinov2_zeroshot slurm/eval_zeroshot.sbatch

experiment_name: visword-row04-dinov2-zeroshot
model_kind: zeroshot_dinov2_cls

data:
  num_eval_samples: 1000

eval:
  k_values: [1, 5, 10, 20]
  phase1_max_pages: 1000
  phase2_max_queries: 200
