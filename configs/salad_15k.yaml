# SALAD-full at 15k train / 1.5k eval / 3 epochs. Fills the data-scale
# row at matched depth vs salad-main (10k×3) and salad-20k (20k×2).
# 15k/(16/4)*3 = 11250 steps × ~2.4s = ~7.5h — fits 8h T4 walltime cap.

experiment_name: visword-salad-15k
model_kind: salad

data:
  num_train_samples: 15000
  num_eval_samples: 1500

train:
  loss: multisim
  k_per_page: 4
  batch_size: 16
  epochs: 3
  lr_backbone: 1.0e-5
  lr_head: 5.0e-4
  eval_every_steps: 400
  num_diag_batches: 3

eval:
  k_values: [1, 5, 10, 20]
  phase1_max_pages: 1500
  phase2_max_queries: 200
