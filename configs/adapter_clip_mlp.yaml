# CLIP ViT-B/16 frozen + MLP adapter (768 → 512 → 256)
experiment_name: adapter-clip-mlp
model_kind: frozen_adapter

backbone:
  arch: clip_vitb16
  feature_dim: 768
  num_trainable_blocks: 0

adapter:
  kind: mlp
  output_dim: 256

data:
  num_train_samples: 10000
  num_eval_samples: 1000

train:
  loss: multisim
  batch_size: 16
  epochs: 3
  lr_backbone: 0.0
  lr_head: 5.0e-4
