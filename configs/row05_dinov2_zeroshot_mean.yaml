# Method ladder — Row 5: DINOv2 ViT-B/14 zero-shot, mean-pooled patches.
# No training; backbone fully frozen. Descriptor = L2-norm(mean over 16×16 patches), 768-d.
# Ablation of row 4: tests whether CLS token or patch-mean is the better
# zero-shot signal.

experiment_name: visword-row05-dinov2-zeroshot-mean
model_kind: zeroshot_dinov2_mean

data:
  num_eval_samples: 1000

eval:
  k_values: [1, 5, 10, 20]
  phase1_max_pages: 1000
  phase2_max_queries: 200
