# Track A — encoder grid: DINOv2-ViT-B/14 + SALAD aggregator at 30k pages × 3 ep.
# One of 4 fine-tune cells in the 72h-demo grid. Same recipe as salad_15k.yaml,
# only data scale differs. lr_backbone=1e-5 is the DINOv2 default.

experiment_name: visword-grid-dinov2-salad-30k
model_kind: salad

data:
  num_train_samples: 30000
  num_eval_samples: 2000

train:
  loss: multisim
  k_per_page: 4
  batch_size: 16
  epochs: 3
  lr_backbone: 1.0e-5
  lr_head: 5.0e-4
  eval_every_steps: 400
  num_diag_batches: 3

eval:
  k_values: [1, 5, 10, 20]
  phase1_max_pages: 2000
  phase2_max_queries: 200
