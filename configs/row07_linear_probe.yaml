# Row 7 — DINOv2 linear probe (frozen backbone + 768→256 Linear head).
# Grounding baseline: how much retrieval signal is linearly decodable from
# frozen DINOv2 features, without any backbone fine-tuning or MLP
# non-linearity? Compare against row 9 (CLS-main: last 4 blocks + MLP).
#
# Training: only the linear head receives gradients. ~20 min on T4.

experiment_name: visword-row07-linear-probe
model_kind: linear_probe

data:
  num_train_samples: 4500
  num_eval_samples: 500

train:
  loss: multisim
  k_per_page: 4
  batch_size: 16
  epochs: 3
  lr_backbone: 0.0       # frozen
  lr_head: 5.0e-4
  eval_every_steps: 200
  num_diag_batches: 3

eval:
  k_values: [1, 5, 10, 20]
  phase1_max_pages: 500
  phase2_max_queries: 200
