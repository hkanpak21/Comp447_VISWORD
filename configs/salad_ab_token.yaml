# SALAD ablation: token_only — keep only the 256-d token_features MLP branch.
# Tests whether SALAD's win over CLS-only is just a learned MLP projection.
#
# Usage:
#   sbatch --export=ALL,CONFIG=configs/salad_ab_token.yaml,RUN_NAME=salad-ab-token slurm/train.sbatch

experiment_name: visword-salad-ab-token
model_kind: salad

data:
  num_train_samples: 4000
  num_eval_samples: 800

salad:
  ablation: token_only

train:
  loss: multisim
  k_per_page: 4
  batch_size: 16
  epochs: 2
  lr_backbone: 1.0e-5
  lr_head: 5.0e-4
  eval_every_steps: 100
  num_diag_batches: 3

eval:
  k_values: [1, 5, 10, 20]
  phase1_max_pages: 400
  phase2_max_queries: 200
