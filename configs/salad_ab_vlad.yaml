# SALAD ablation: vlad_only — drop the 256-d token branch, keep 8192-d VLAD.
# Tests whether the global-token branch is what carries the SALAD win.
#
# Usage:
#   sbatch --export=ALL,CONFIG=configs/salad_ab_vlad.yaml,RUN_NAME=salad-ab-vlad slurm/train.sbatch

experiment_name: visword-salad-ab-vlad
model_kind: salad

data:
  num_train_samples: 4000
  num_eval_samples: 800

salad:
  ablation: vlad_only

train:
  loss: multisim
  k_per_page: 4
  batch_size: 16
  epochs: 2
  lr_backbone: 1.0e-5
  lr_head: 5.0e-4
  eval_every_steps: 100
  num_diag_batches: 3

eval:
  k_values: [1, 5, 10, 20]
  phase1_max_pages: 400
  phase2_max_queries: 200
