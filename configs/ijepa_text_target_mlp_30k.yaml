experiment_name: visword-ijepa-text-target-mlp-30k
model_kind: ijepa_finetune

backbone:
  arch: ijepa_vith14
  feature_dim: 1280
  num_trainable_blocks: 4
  pretrained_checkpoint: /scratch/bbakay22/VISWORD/runs/2026-06-03_070502_acfc947c_ijepa-text-target-all-blocks-ful_e27e/checkpoints/best_phase1.pt

data:
  num_train_samples: 30000
  num_eval_samples: 2000

train:
  loss: multisim
  k_per_page: 4
  batch_size: 16
  epochs: 3
  lr_backbone: 5.0e-6
  lr_head: 5.0e-4
  eval_every_steps: 400
  num_diag_batches: 3

eval:
  k_values: [1, 5, 10, 20]
  phase1_max_pages: 2000
  phase2_max_queries: 200
