# DINOv2 + CLS-only baseline at the same scale as configs/salad_smoke.yaml.
# Lets us answer "did the official SALAD finally beat CLS-only?" — the
# central question CONTEXT.md session 2 left open.
#
# Usage (cache must already exist; assumes salad_smoke prefetch has run):
#   sbatch --export=ALL,CONFIG=configs/cls_smoke.yaml,RUN_NAME=cls-smoke-5k slurm/train.sbatch
#   then eval the resulting run dir via slurm/eval.sbatch.

experiment_name: visword-cls-smoke
model_kind: cls

data:
  num_train_samples: 4000
  num_eval_samples: 800

train:
  loss: multisim
  k_per_page: 4
  batch_size: 16
  epochs: 2
  lr_backbone: 1.0e-5
  lr_head: 5.0e-4
  eval_every_steps: 100
  num_diag_batches: 3

eval:
  k_values: [1, 5, 10, 20]
  phase1_max_pages: 400
  phase2_max_queries: 200
