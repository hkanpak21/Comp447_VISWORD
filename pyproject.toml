[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visword"
version = "0.1.0"
description = "Vision-based retrieval over text document screenshots (DINOv2 + SALAD)."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "VisWord authors" }]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "huggingface_hub>=0.23",
    "datasets>=2.18",
    "pillow>=10.0",
    "matplotlib>=3.7",
    "sentence-transformers>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: end-to-end tests that need a data cache",
    "gpu: tests that require CUDA",
    "slurm: manual SLURM-smoke entries, not collected by pytest",
]
addopts = "-ra"
